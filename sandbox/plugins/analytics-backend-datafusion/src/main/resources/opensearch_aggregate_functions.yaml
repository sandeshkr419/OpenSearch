---
urn: extension:org.opensearch:aggregate_functions
aggregate_functions:
  - name: avg
    description: "Average. State shipped as IPC-encoded Binary via StateShippingUdaf."
    impls:
      - args:
          - value: any1
            name: "input"
        nullability: DECLARED_OUTPUT
        return: any1
  - name: stddev_pop
    description: "Population standard deviation. State shipped as IPC-encoded Binary."
    impls:
      - args:
          - value: any1
            name: "input"
        nullability: DECLARED_OUTPUT
        return: any1
  - name: stddev_samp
    description: "Sample standard deviation. State shipped as IPC-encoded Binary."
    impls:
      - args:
          - value: any1
            name: "input"
        nullability: DECLARED_OUTPUT
        return: any1
  - name: var_pop
    description: "Population variance. State shipped as IPC-encoded Binary."
    impls:
      - args:
          - value: any1
            name: "input"
        nullability: DECLARED_OUTPUT
        return: any1
  - name: var_samp
    description: "Sample variance. State shipped as IPC-encoded Binary."
    impls:
      - args:
          - value: any1
            name: "input"
        nullability: DECLARED_OUTPUT
        return: any1
  - name: count
    description: "Count (and count distinct). State shipped as IPC-encoded Binary."
    impls:
      - args:
          - value: any1
            name: "input"
        nullability: DECLARED_OUTPUT
        return: any1
  - name: approx_distinct
    description: >-
      Approximate distinct count using HyperLogLog. Maps to DataFusion's
      built-in `approx_distinct` function. State shipped as IPC-encoded Binary.
    impls:
      - args:
          - value: any1
            name: "input"
        nullability: DECLARED_OUTPUT
        return: i64
  - name: take
    description: "Collects the first N values per group into an array."
    impls:
      - args:
          - value: any1
            name: "input"
          - value: i64
            name: "limit"
        nullability: DECLARED_OUTPUT
        return: any1
      - args:
          - value: any1
            name: "state"
        nullability: DECLARED_OUTPUT
        return: any1
  - name: list_merge
    description: "Merges per-shard list states by concatenation."
    impls:
      - args:
          - value: any1
            name: "input"
        nullability: DECLARED_OUTPUT
        return: any1
  - name: list_merge_distinct
    description: "Merges per-shard list states and deduplicates."
    impls:
      - args:
          - value: any1
            name: "input"
        nullability: DECLARED_OUTPUT
        return: any1
  - name: internal_pattern
    description: >-
      PPL `patterns ... method=BRAIN` (aggregation mode). Custom Rust UDAF in
      `rust/src/udaf/internal_pattern.rs`. Collects per-group log lines, runs
      BRAIN over the corpus at finalize time, and emits
      List<Struct<pattern, pattern_count, tokens, sample_logs>>.
      The variadic tail (max_sample_count, buffer_limit, show_numbered_token,
      [threshold_percentage], [variable_count_threshold]) is consumed from the
      aggregate call's literal args at accumulator-construction time, so
      Substrait sees them as additional ANY positional arguments.
    impls:
      - args:
          - name: field
            value: any1
          - name: max_sample_count
            value: any2
          - name: buffer_limit
            value: any3
          - name: show_numbered_token
            value: any4
        return: any5
      - args:
          - name: field
            value: any1
          - name: max_sample_count
            value: any2
          - name: buffer_limit
            value: any3
          - name: show_numbered_token
            value: any4
          - name: threshold_percentage
            value: any5
        return: any6
      - args:
          - name: field
            value: any1
          - name: max_sample_count
            value: any2
          - name: buffer_limit
            value: any3
          - name: show_numbered_token
            value: any4
          - name: threshold_percentage
            value: any5
          - name: variable_count_threshold
            value: any6
        return: any7
      - args:
          - name: state
            value: any1
        return: any2
